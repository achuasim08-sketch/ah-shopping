<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | AH SHOPPING</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .profile-section {
            background: rgba(43, 43, 43, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(42, 221, 241, 0.3);
        }
        .profile-section h2 {
            color: #2addef;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(42,221,241,0.3);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #ccc;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(42,221,241,0.3);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #2addef;
            box-shadow: 0 0 10px rgba(42,221,241,0.3);
        }
        .update-btn {
            background: #2addef;
            color: #111;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .update-btn:hover {
            background: white;
            box-shadow: 0 0 15px rgba(42,221,241,0.5);
        }
        .bids-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .bid-card {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(42,221,241,0.2);
        }
        .bid-card h3 {
            margin: 0 0 10px 0;
            color: white;
        }
        .bid-card .price {
            color: #00ff00;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .bid-card .timer {
            color: #ff4d4d;
            font-size: 0.9rem;
        }
        .bid-card a {
            display: inline-block;
            margin-top: 10px;
            color: #2addef;
            text-decoration: none;
            border: 1px solid #2addef;
            padding: 5px 10px;
            border-radius: 4px;
            transition: 0.3s;
        }
        .bid-card a:hover {
            background: #2addef;
            color: #111;
        }
        .empty-msg {
            color: #888;
            text-align: center;
            padding: 40px;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='index.html'">AH SHOPPING</div>
        <nav>
            <button onclick="location.href='upload.html'">Sell Item</button>
            <button onclick="location.href='history.html'" title="View Transaction History">📜 History</button>
            <button onclick="location.href='leaderboard.html'" title="Top Bidders">🏆 Leaderboard</button>
            <button onclick="location.href='profile.html'" title="My Profile">👤 Profile</button>
            <div class="user-profile">Profile</div>
        </nav>
    </header>

    <main class="profile-container">
        <div class="profile-section">
            <h2>Edit Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="profileUsername" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" title="Username can only contain letters, numbers, and underscores">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" disabled style="background: rgba(255,255,255,0.1); color: #888;">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="profilePhone" required pattern="[0-9]{10}" title="10-digit mobile number">
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <textarea id="profileAddress" rows="3" required></textarea>
                </div>
                <button type="submit" class="update-btn">Update Profile</button>
            </form>
            <div style="margin-top: 20px;">
                <a href="#" onclick="resetPassword()" style="color: #2addef;">Change Password</a>
            </div>
        </div>

        <div class="profile-section">
            <h2>My Active Bids</h2>
            <div id="activeBidsGrid" class="bids-grid">
                <p class="empty-msg">Loading...</p>
            </div>
        </div>

        <div class="profile-section">
            <h2>My Won Auctions</h2>
            <div id="wonAuctionsGrid" class="bids-grid">
                <p class="empty-msg">Loading...</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
    <script src="profile.js"></script>
</body>
</html>
