<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | AH SHOPPING</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer">AH SHOPPING</div>
        <div class="user-profile">Secure Checkout 🔒</div>
    </header>

    <main class="upload-container">
        <div class="form-card" style="max-width: 500px; width: 100%;">
            <h2>Order Summary</h2>
            
            <div id="checkoutSummary" style="margin-bottom: 25px; text-align: left; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 8px; border: 1px solid rgba(42, 221, 241, 0.2);">
                <p>Loading order details...</p>
            </div>
            
            <h2>Shipping & Payment</h2>
            <form id="checkoutForm">
                <label>Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
                
                <label>Shipping Address</label>
                <textarea id="shippingAddress" rows="3" required placeholder="Street address, City, State, PIN..."></textarea>
                
                <label>Card Number</label>
                <input type="text" id="cardNumber" required placeholder="XXXX-XXXX-XXXX-XXXX" pattern="\d{16}" title="Please enter a 16-digit card number">
                
                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Expiry Date</label>
                        <input type="text" id="expiryDate" required placeholder="MM/YY">
                    </div>
                    <div style="flex: 1;">
                        <label>CVV</label>
                        <input type="password" id="cvv" required placeholder="XXX" pattern="\d{3}" title="3-digit CVV">
                    </div>
                </div>

                <button type="button" 
                        class="easypayio-pay-btn submit-btn" 
                        id="payNowBtn"
                        data-amount=""
                        data-product-name=""
                        data-product-description=""
                        data-user-email=""
                        style="background: #00ff00; color: #111; box-shadow: 0 0 15px rgba(0,255,0,0.4);">
                    Pay with EasyPayIO 💳
                </button>

                <button type="submit" style="display: none;">Submit</button>
            </form>

            <div id="paymentLoading" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
                <div class="loading-spinner" style="border: 4px solid rgba(42, 221, 241, 0.3); border-top: 4px solid #2addef; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;"></div>
                <p style="color: #2addef; margin-top: 20px;">Processing payment...</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="easypayio-gateway.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
