<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AH SHOPPING</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="logo">AH SHOPPING</div>
        <h2>Create Account</h2>
        <form id="signupForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="su-email" required placeholder="you@example.com">
            </div>
            
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="su-phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="su-pass" required placeholder="Create a password">
            </div>

            <button type="submit" class="submit-btn">Sign Up</button>
            <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
